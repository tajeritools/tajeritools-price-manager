name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TajeriTools-Price-Manager desktop/tajeritools_price_manager.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/TajeriTools-Price-Manager.exe")) { throw "EXE not found" }
          Get-Item "dist/TajeriTools-Price-Manager.exe" | Format-List Name,Length,FullName

      - uses: actions/upload-artifact@v4
        with:
          name: TajeriTools-Price-Manager-Windows-EXE
          path: dist/TajeriTools-Price-Manager.exe
          if-no-files-found: error
          retention-days: 90
